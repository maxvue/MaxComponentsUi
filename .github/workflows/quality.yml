name: Quality Gate

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run Quality Gate Verification
              run: npm run verify

            - name: Verify clean git status
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      echo "Erro: Foram encontradas alterações não commitadas geradas pelo gate de qualidade:"
                      git status --short
                      exit 1
                  fi
