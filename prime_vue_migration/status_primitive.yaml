# =============================================================================
# STATUS DA MIGRAÇÃO — TRILHA "PRIMITIVE" (primitivas base)
# =============================================================================
# Fonte de verdade da trilha executada por `execute_primitive.md`.
# É a PRIMEIRA das três trilhas — roda sozinha, antes de todas as outras.
#
#   1. status_primitive.yaml  <-- ESTE ARQUIVO (roda primeiro, sozinho)
#          |
#          +--> 2. status_in_use.yaml   (item a item, com teste manual)
#          +--> 3. status_no_use.yaml   (lote contínuo, sem pausas)
#                  As duas podem rodar EM PARALELO depois desta.
#
# Execução ITEM A ITEM, com PAUSA para teste manual do usuário entre cada item.
#
# Status possíveis (para `execucao` e `verificacao`):
#   Aguardando  -> ainda não iniciado
#   Realizando  -> em andamento, não finalizado
#   Concluído   -> finalizado e aprovado
#
# Campo extra:
#   teste_usuario : Aguardando | Aprovado | Reprovado
# =============================================================================

meta:
  projeto: '@maxvue/max-components-ui'
  trilha: 'primitive'
  objetivo: 'Migrar as primitivas base — dependência comum das trilhas in_use e no_use'
  primevue_versao_atual: '4.5.5'
  gerado_em: '2026-08-07'
  total_itens: 5
  modo_execucao: >-
    SEQUENCIAL COM PAUSA OBRIGATÓRIA — um item por vez; migrar, verificar, PARAR e
    aguardar a aprovação manual do usuário antes de pegar o próximo. 5 itens = 5 paradas.
    Esta trilha NÃO tem modo contínuo: cada primitiva é dependência de toda a biblioteca,
    e aprovar em bloco impede identificar qual delas introduziu um defeito.

  # ---------------------------------------------------------------------------
  # POR QUE ESTA TRILHA EXISTE
  # ---------------------------------------------------------------------------
  # As primitivas base são dependência de componentes das DUAS outras trilhas.
  # Enquanto viviam dentro da status_in_use.yaml, a trilha no_use não podia
  # começar sem esperar por elas (o MaxInputIconPicker depende dos ids 1, 2 e 4).
  # Isoladas aqui, elas rodam uma vez, são integradas, e então in_use e no_use
  # ficam livres para rodar em paralelo, cada uma no seu worktree.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # REGRAS DESTA MIGRAÇÃO QUE DIFEREM DO BRIEFING ORIGINAL
  # ---------------------------------------------------------------------------
  # 1. REUSO PRIMEIRO: antes de implementar, o executor verifica se já existe no
  #    projeto uma solução concisa, PrimeVue-free e funcional para o mesmo fim.
  # 2. SEM CLASSES .p-*: as classes do PrimeVue não devem nem precisam ser
  #    emitidas. Use nomes próprios e remova as regras .p-* órfãs do repo.
  # 3. PARIDADE SÓ DE PROPS: apenas as PROPS precisam ser iguais às do PrimeVue.
  #    Markup interno, classes e estrutura são livres.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # ⚠️ EFEITO COLATERAL CONHECIDO DA REGRA 2 (reportar, não silenciar)
  # ---------------------------------------------------------------------------
  # Apps consumidoras estilizam classes .p-* por fora. Contagem de referências
  # .p-* no CSS/SCSS/Vue de cada projeto (censo de 2026-08-07):
  #   MinhaBibliaOnline : 254   <- tem uma pasta resources/Theme/PrimeVue/ inteira
  #   engeapp           : 167
  #   AgenteDeBolso     :  63
  #   SocialMedia       :   2
  #   MaxAdmin / mbo    :   0
  # Quando um seletor .p-* deixar de ser emitido, o CSS correspondente nessas
  # apps PARA DE APLICAR — a tela funciona, mas muda de aparência.
  # Isso é ACEITO nesta migração (decisão do usuário). A obrigação do executor é
  # LISTAR cada classe .p-* removida, para o ajuste posterior do CSS das apps.
  # ---------------------------------------------------------------------------

  baseline_testes: >-
    2026-08-07, worktree primevue-primitive (branch a partir de dev 0c192bc5):
    614 passando / 18 falhando, 63 arquivos ok / 7 com falha (70 no total).
    Falhas PRÉ-EXISTENTES, anteriores a qualquer alteração desta migração —
    não são regressão e não bloqueiam itens: InputBase.test.ts,
    MaxInputSwitch.test.ts, MaxInputMarkdown.test.ts, MaxInputCpfCnpj.test.ts,
    MaxCreditCard.test.ts, MaxLoaderAi.test.ts, MaxInputAutoCompleteApi.test.ts.
    Critério para os itens: a suíte deve continuar com 614 passando e as MESMAS
    7 falhas. Qualquer falha nova, ou um desses números piorando, é regressão.

  intocaveis:
    - src/components/InputBase.vue

  # Peças do repositório que JÁ são PrimeVue-free — candidatas a reuso (§2 do executor)
  reuso_candidatos:
    - src/components/MaxPopover.vue          # overlay posicionado — base do MaxBaseOverlay
    - src/components/MaxInputSwitch.vue      # toggle completo, sem PrimeVue
    - src/components/InputBase.vue           # wrapper de input (intocável, mas referência)
    - src/components/MaxTableFields.vue
    - src/components/MaxInputFileUploadBig.vue
    - '@tanstack/vue-virtual'                # já em dependencies — base do VirtualScroller

itens:

  - id: 1
    componente: MaxBaseInput
    arquivo: src/components/base/MaxBaseInput.vue
    plano: prime_vue_migration/plans/01-MaxBaseInput.md
    primitivas: [InputText]
    depende_de: []
    uso: 'INTERNA — destrava 10 inputs de texto usados em 5 projetos'
    execucao: Concluído
    verificacao: Concluído
    teste_usuario: Aguardando
    tentativas: 0
    classes_p_removidas: ['p-inputtext', 'p-component', 'p-filled', 'p-inputtext-sm', 'p-inputtext-lg', 'p-inputtext-fluid', 'p-variant-filled', 'p-invalid', 'p-disabled']
    notas: >-
      Concluído em 2026-08-07. Raiz continua sendo o <input> puro (requisito do v-maska).
      Classes .p-* substituídas por max-input / max-input-has-value / max-input-sm /
      max-input-lg / max-input-fluid / max-input-filled / max-input-invalid /
      max-input-disabled, com <style> próprio usando as variáveis do tema Max.
      Props, eventos e defineExpose preservados.
      Teste criado: tests/components/base/MaxBaseInput.test.ts (13 asserções).
      MUTAÇÕES TESTADAS (todas fazem o teste falhar): (1) remover emit update:modelValue;
      (2) hasValue fixo em true; (3) envolver o <input> num <div> — pega pelo teste de
      v-maska; (4) reintroduzir a classe p-inputtext.
      ACHADO: a primeira versão do teste usava setValue(), que emite update:modelValue
      por conta própria e deixava a mutação (1) sobreviver. Trocado por disparo do evento
      input nativo.
      Portões: vitest 13/13; type-check limpo; lint 0 erros (2 warnings pré-existentes em
      MaxInputMarkdown/MaxTagsList); suíte 627 passando / 18 falhando (mesmas 7 do
      baseline, sem regressão).
      VERIFICAÇÃO (subagente opus): APROVADO, com 2 achados MENORES já corrigidos:
      (a) os dois testes que deveriam guardar o contrato do v-maska eram inúteis —
      wrapper.element do @vue/test-utils resolve até o filho significativo e reportava
      'INPUT' mesmo com um <div> em volta; quem matava a mutação (3) era, por acidente, o
      teste de atributos herdados. Asserção trocada para olhar o HTML bruto
      (html().startsWith('<input') + find('div') inexistente); revalidado: com o <div>
      wrapper agora falham 2 testes, incluindo o guardião correto.
      (b) MaxChart.vue tinha alterações de vírgula do --fix do ESLint, sem relação com o
      item; revertido para manter o diff limpo.

  - id: 2
    componente: MaxBaseOverlay
    arquivo: src/components/base/MaxBaseOverlay.vue
    plano: prime_vue_migration/plans/02-MaxBaseOverlay.md
    primitivas: []
    depende_de: []
    uso: 'INTERNA — base de Select/AutoComplete/DatePicker/Menu/Drawer'
    execucao: Aguardando
    verificacao: Aguardando
    teste_usuario: Aguardando
    tentativas: 0
    classes_p_removidas: []
    notas: >-
      Teleport + posicionamento + click-outside + ESC.
      REUSO: MaxPopover.vue já é PrimeVue-free e resolve overlay posicionado —
      avaliar estender/reaproveitar antes de escrever do zero.

  - id: 3
    componente: MaxBaseSpinner
    arquivo: src/components/base/MaxBaseSpinner.vue
    plano: prime_vue_migration/plans/03-MaxBaseSpinner.md
    primitivas: [ProgressSpinner]
    depende_de: []
    uso: 'INTERNA — usada por MaxPdfView e MaxInputFileUpload (ambos usados)'
    execucao: Aguardando
    verificacao: Aguardando
    teste_usuario: Aguardando
    tentativas: 0
    classes_p_removidas: []
    notas: >-
      SVG animado puro. REUSO: conferir MaxLoader.vue / MaxLoaderIcon.vue, que já
