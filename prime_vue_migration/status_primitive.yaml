  - id: 4
    componente: MaxBaseVirtualScroller
    arquivo: src/components/base/MaxBaseVirtualScroller.vue
    plano: prime_vue_migration/plans/04-MaxBaseVirtualScroller.md
    primitivas: [VirtualScroller]
    depende_de: []
    uso: 'INTERNA — dependência do MaxInputIconPicker (trilha no_use) e do MaxTagSelect'
    execucao: Aguardando
    verificacao: Aguardando
    teste_usuario: Aguardando
    tentativas: 0
    classes_p_removidas: []
    notas: >-
      @tanstack/vue-virtual JÁ está nas dependencies — usar em vez de implementar do zero.
      É este item que destrava a trilha no_use.
      ATENÇÃO: MaxTagSelect.vue tem regra .p-virtualscroller no <style> (linha ~330);
