# =============================================================================
# STATUS DA MIGRAÇÃO — INDEPENDÊNCIA DO PRIMEVUE
# =============================================================================
# Fonte de verdade do progresso. O agente executor (execution.md) LÊ e ESCREVE
# neste arquivo a cada passo.
#
# Status possíveis (para `execucao` e `verificacao`):
#   Aguardando  -> ainda não iniciado
#   Realizando  -> em andamento, não finalizado
#   Concluído   -> finalizado e aprovado
#
# Campos por item:
#   id           : ordem de execução (NÃO reordenar)
#   componente   : nome do arquivo .vue (sem extensão) ou do módulo
#   arquivo      : caminho do arquivo a ser alterado
#   plano        : caminho do plano de implementação detalhado
#   primitivas   : primitivas PrimeVue que este item elimina
#   depende_de   : ids que precisam estar Concluídos antes deste
#   execucao     : Aguardando | Realizando | Concluído
#   verificacao  : Aguardando | Realizando | Concluído
#   tentativas   : nº de vezes que a verificação reprovou (o executor incrementa)
#   notas        : anotações livres do executor (progresso parcial, bloqueios)
# =============================================================================

