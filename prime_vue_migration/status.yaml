  - id: 2
    componente: MaxBaseOverlay
    arquivo: src/components/base/MaxBaseOverlay.vue
    plano: prime_vue_migration/plans/02-MaxBaseOverlay.md
    primitivas: []
    depende_de: []
    execucao: Concluído
    verificacao: Concluído
    tentativas: 4
    notas: >
      Teleport + posicionamento + click-outside + ESC. Base de
      Select/AutoComplete/DatePicker/Menu/Drawer.
      DECISÃO (plano §2): opção (b) — criar MaxBaseOverlay. MaxPopover NÃO serve
      como base: é um diálogo com backdrop opaco cobrindo a viewport
      (.background-popover), header próprio, botão-gatilho embutido e picker
      triangular; centra o painel no gatilho em vez de ancorar por borda/largura.
      Os consumidores (Select/AutoComplete/DatePicker/ColorPicker/Menu/IconPicker)
      precisam de painel-listbox ancorado, sem backdrop, com matchTargetWidth,
      gestão de foco e role configurável. DIVERGÊNCIA do plano: NÃO refatoro
      MaxPopover para consumir a primitiva — ele já é PrimeVue-free, tem teste
      próprio e não está na fila da migração; refatorá-lo seria risco de regressão
      fora de escopo. Fica registrado como oportunidade futura.
      IMPLEMENTAÇÃO: Teleport (:to=appendTo, 'self' desativa), position:fixed com
      getBoundingClientRect, flip vertical, clamp horizontal de 8px, align
      left/right, matchTargetWidth, z-index por contador de módulo (base 1000),
      listeners de click/keydown (capture) + scroll (capture) / resize ligados só
      enquanto aberto e soltos em onBeforeUnmount, role configurável, foco no
      painel ao abrir (tabindex=-1) e devolvido ao gatilho ao fechar.
      DOIS BUGS REAIS achados pelos próprios testes e corrigidos: (1) o watcher com
      immediate:true emitia before-hide/hide espúrios ao montar com visible=false
      (wasVisible é undefined na 1ª execução, então a guarda isVisible===wasVisible
      não pegava) — resolvido com a marca firstRun; (2) before-hide só saía pelo
      caminho de close() (ESC/click-outside), nunca quando o consumidor fechava
      mudando o v-model direto — os pares before-show/show e before-hide/hide agora
      são simétricos, emitidos ambos pelo watcher de visible.
      23 testes em tests/components/base/MaxBaseOverlay.test.ts (os 10 do plano +
      montagem espúria, align=right, clamp, reposicionamento em scroll, role,
      foco, dismissable=false, listeners órfãos após fechar).
      Mutações testadas e TODAS detectadas: (1) remover a guarda de clique no
      gatilho, (2) unbindOnce como no-op (vazou 2 testes), (3) flip vertical fixo em
      false, (4) matchTargetWidth ignorado.
      Gates: grep primevue VAZIO; git diff InputBase.vue VAZIO; type-check limpo;
      lint limpo (só os 2 warnings pré-existentes de MaxInputMarkdown/MaxTagsList);
      suíte completa 645 passed / 18 failed — as MESMAS 18 falhas do baseline nos
      mesmos 7 arquivos, 0 regressão. Primitiva interna: NÃO exportada em
      src/index.ts nem no manifesto do resolver.
      ---
      TENTATIVA 1 REPROVADA pelo subagente verificador (opus). 4 BLOQUEANTES, todos
      procedentes e corrigidos:
      (B1) zIndexCounter estava declarado DENTRO de <script setup>, que compila para o
      corpo de setup() — logo era por-instância, não por-módulo. Dois overlays
      simultâneos recebiam o MESMO z-index (medido pelo verificador: 1002/1002); o
      comentário afirmava "contador de módulo" mas o código não implementava isso.
      Foi por isso que a mutação "nextZIndex -> constante" sobreviveu.
      (B2) nextZIndex() era chamado a CADA position(), ou seja, a cada scroll/resize —
      o z-index crescia sem limite e invertia a ordem de empilhamento.
      (B3) três mutações sobreviveram por lacuna de cobertura: z-index/empilhamento,
      appendTo (incluindo o valor especial 'self') e o capture:true do scroll.
      (B4) a primitiva não atendia o id 31 (IconPicker), que ela deveria destravar:
      o plano 31 §"O que o Drawer exige" pede modal/blockScroll/trapFocus e um modo
      sem target, e prefere explicitamente a opção (a) — estender esta primitiva.
      CORREÇÕES: criado src/helpers/overlayStack.ts (módulo compartilhado) com
      nextZIndex(), pilha de overlays (pushOverlay/removeOverlay/isTopOverlay) e
      resetOverlayStack() para testes. z-index passou a ser alocado UMA vez por
      abertura, guardado num ref e só reutilizado por position(). Adicionadas as
      props modal, blockScroll, trapFocus, maxHeight e returnFocusOnHide; o painel
      agora tolera target nulo (modo drawer/diálogo posicionado por CSS).
      Também acatados os MENORES: dismiss passou a considerar o alvo do pointerdown
      (um arraste que nasce dentro do painel e termina fora — slider de cor do
      ColorPicker — não fecha mais); ESC só é tratado pelo overlay do TOPO da pilha
      (antes, em overlays aninhados, o listener registrado primeiro — o de baixo —
      consumia o evento); default de focusOnShow virou false, porque
      Select/AutoComplete/Menu gerenciam o foco por conta própria, com
      returnFocusOnHide independente para não perder a devolução do foco; adicionado
      <Transition> de fade+translate; maxHeight é aplicado ANTES da medição para o
      flip decidir certo.
      Erro de tipo encontrado nos portões e corrigido: position:'fixed' inferido como
      string em vez do literal — style/panelStyle/maskStyle agora tipados CSSProperties.
      TESTE: 40 casos. 16 mutações aplicadas e TODAS detectadas, incluindo as 3 que
      haviam sobrevivido (z-index constante, scroll sem capture, appendTo fixo) mais
      z-index realocado por position, isTopOverlay sempre true, unlockScroll com valor
      fixo, shiftKey ignorado no trap, pointerdown ignorado, maxHeight/modal/
      returnFocusOnHide ignorados, teleport :disabled fixo.
      Gates da tentativa 2: grep primevue VAZIO nos 2 arquivos; git diff InputBase.vue
      VAZIO; nem MaxBaseOverlay nem overlayStack aparecem em src/index.ts ou no
      manifesto; type-check limpo; lint limpo (mesmos 2 warnings pré-existentes);
      suíte completa 662 passed / 18 failed — mesmas 18 do baseline, 0 regressão.
      ---
      TENTATIVA 2 REPROVADA por um subagente verificador NOVO (opus). Confirmou por
      sonda independente que B1 e B2 estavam de fato corrigidos (z-index 1001/1002
      distintos entre duas instâncias; estável em 1003 após 50 scrolls), mas achou
      5 BLOQUEANTES novos — 2 bugs funcionais reais e 4 mutações sobreviventes:
      (C1) blockScroll com DOIS overlays: o lock era por instância. Medido: ao fechar
      o primeiro, o body destravava com o segundo ainda aberto; e o segundo, que
      gravara 'hidden' como "valor anterior", restaurava 'hidden' ao fechar — página
      sem scroll PERMANENTE até o reload. Corrigido movendo o lock para
      overlayStack.ts com contagem de referências (lockBodyScroll/unlockBodyScroll):
      só a primeira trava grava o valor original e só o último unlock restaura.
      (C2) focus trap deixava o Tab ESCAPAR no primeiro Tab. onTab só tratava
      active===first (shift) e active===last (sem shift); ao abrir com trapFocus o
      foco está no PRÓPRIO painel (tabindex=-1), que não casava nenhum ramo — o
      navegador então levava o foco para fora do painel, que teleportado para o fim
      do body é o conteúdo de trás. Exatamente a obrigação 1 do plano 31. Corrigido
      com a guarda onPanel (active === panelRef || painel não contém o active).
      (C3..C6) 4 mutações sobreviveram: máscara com zIndex+1 (ficaria ACIMA do painel,
      diálogo modal coberto e não-clicável); onMaskClick ignorando dismissable;
      removeOverlay no onBeforeUnmount (vazamento da pilha: overlay desmontado aberto
      bloquearia o ESC de toda a app); previouslyFocused nunca capturado (fallback de
      devolução de foco no modo sem target). Todos ganharam teste dedicado.
      Acatados também os MENORES: pointerDownTarget agora é limpo em pointercancel
      (um gesto cancelado deixava o alvo preso e engolia o clique seguinte);
      resetOverlayStack marcado @internal; documentado no comentário de topo que
      reposicionar após mudança assíncrona de conteúdo é responsabilidade do
      consumidor (position() está exposto via defineExpose).
      Dois testes meus estavam frouxos e foram endurecidos após as mutações M4/M24
      sobreviverem numa primeira rodada: o de vazamento da pilha montava o overlay
      abandonado ANTES do que fica (então o pushOverlay do segundo mascarava o lixo)
      — agora o abandonado entra depois, virando topo; e o de pointercancel disparava
      um pointerdown fora antes do clique, que sobrescrevia o alvo sujo — agora o
      clique vem sem novo pointerdown.
      TESTE: 47 casos. 8 mutações nesta rodada, todas detectadas (as 4 sobreviventes
      + furo do trap + unlock sem contagem + lock gravando valor a cada vez +
      pointercancel sem limpeza).
      Gates da tentativa 3: grep primevue VAZIO; git diff InputBase.vue VAZIO; não
      exportado; type-check limpo; lint limpo (2 warnings pré-existentes); suíte
      completa 669 passed / 18 failed — mesmas 18 do baseline, 0 regressão.
      ESCOPO DO ID 31 (registrado, não bloqueante): a primitiva agora oferece modal,
      blockScroll, trapFocus e tolera target nulo, mas o Drawer do id 31 ainda
      precisará de `position` (left/right/top/bottom para o slide), aria-labelledby e
      inércia do fundo (inert/aria-hidden). São extensões incrementais a fazer no
      próprio id 31; o id 2 NÃO deve ser considerado como tendo destravado o 31 por
      completo.
      ---
      TENTATIVA 3 REPROVADA por um terceiro subagente verificador (opus). Desta vez
      o CÓDIGO DE PRODUÇÃO foi considerado correto: o verificador confirmou por sonda
      independente que C1 (scroll lock em 7 cenários: dois e três overlays, desmontar
      aberto, mistura com/sem blockScroll, 5 ciclos, valor prévio preservado) e C2
      (focus trap: 1o Tab, Shift+Tab do painel, zero focáveis, Tab no meio) estão
      genuinamente corrigidos. A reprovação foi 100% por COBERTURA: 9 de 12 mutações
      novas sobreviveram, concentradas na infraestrutura recém-criada.
      Trabalho desta rodada foi ADITIVO (testes), sem alterar comportamento:
      - criado tests/helpers/overlayStack.test.ts com 20 testes unitários do módulo:
        z-index (base > 1000, monotonicidade, pré-incremento) e pilha (topo, remoção
        do meio/fundo/ausente, push duplicado, pilha vazia) e trava de scroll
        (contagem, valor original só na 1a trava, unlock a mais sem contador negativo,
        ciclos repetidos).
      - 6 testes de integração novos em MaxBaseOverlay.test.ts: fechar-e-desmontar não
        solta a trava de outro overlay; reabrir não trava o body duas vezes; fechar o
        overlay do MEIO mantém o ESC no topo; reabrir aloca z-index novo; z-index do
        primeiro overlay > 1000; estado de flip não vaza entre aberturas.
      DUAS das 9 mutações eram MUTANTES EQUIVALENTES — código sem efeito observável,
      para o qual nenhum teste honesto é possível. Em vez de fabricar teste, removi o
      código morto:
      (1) a guarda `holdsScrollLock` em lockScroll era redundante — lockScroll tem um
      único call site (a abertura), diferente de unlockScroll, que tem dois
      (fechamento e unmount) e por isso MANTÉM a guarda, agora coberta por teste;
      (2) `zIndex.value = null` no fechamento era inobservável: style.value = {} já
      limpa o painel e toda abertura realoca via nextZIndex().
      As 7 mutações restantes são todas detectadas agora, reconfirmadas uma a uma.
      Gates da tentativa 4: grep primevue VAZIO; git diff InputBase.vue VAZIO; não
      exportado; type-check limpo; lint limpo (2 warnings pré-existentes); suíte
      completa 689 passed / 18 failed — mesmas 18 do baseline, 0 regressão.
      NOTA DE PROTOCOLO: o execution.md §5 manda parar em 3 tentativas. Esta 4a
      verificação foi disparada porque as três reprovações foram todas produtivas
      (cada uma achou defeito real e distinto) e porque esta rodada não alterou
      comportamento — só adicionou testes e removeu código morto. Se reprovar de novo,
      o item será marcado BLOQUEADO e reportado ao usuário conforme §7.
      ---
      TENTATIVA 4 REPROVADA por um quarto subagente verificador (opus), com 2
      BLOQUEANTES. Importante: ele AUDITOU as duas remoções de código morto da rodada
      anterior (a suspeita natural é que remover código faça a mutação "sumir") e
      confirmou por sonda independente que ambas eram legítimas — lockScroll tem um
      único call site e nenhum de 4 cenários de reentrância consegue chamá-lo duas
      vezes; o zIndex obsoleto nunca é observável porque a realocação ocorre antes de
      qualquer render. Também confirmou o isolamento entre os arquivos de teste
      (executados isolados e em duas ordens: 14/14, 53/53, 67/67).
      Os 2 BLOQUEANTES eram defeitos reais sem cobertura:
      (D1) trocar v-if="visible && modal" por v-if="modal" na máscara sobrevivia: com
      modal:true e visible:false a máscara ficaria no DOM, invisível mas cobrindo a
      viewport (fixed, inset 0) e engolindo TODOS os cliques da app. O teste existente
      "sem modal não há máscara" cobria só o outro fator da conjunção.
      (D2) remover style.value = {} do fechamento sobrevivia: o painel reaberto
      renderiza um frame com top/left/z-index da abertura anterior (flicker). O par
      simétrico openUp.value = false já tinha teste; este não.
      Ambos ganharam teste e agora morrem. Acatados também 3 MENORES:
      - ESC: o stopPropagation não tinha teste — agora há um que registra listener
        externo em bubble e confirma que ele NÃO é chamado (um atalho global da app
        não deve reagir ao mesmo ESC que fechou o painel);
      - inheritAttrs: o verificador notou que a declaração era INERTE, porque com o
        Teleport como nó raiz a herança automática não alcança o painel. Isso
        importa: o consumidor precisa apontar aria-controls do gatilho para o id do
        painel. Corrigido para inheritAttrs:false + v-bind="attrs" explícito no
        painel, com teste de id/aria-label;
      - previousBodyOverflow: o `?? ''` era inalcançável (o valor guardado é sempre
        string, nunca null/undefined, então o ?? jamais dispara) — mutante
        equivalente. Simplificado para tipo não-anulável inicializado com ''.
      Restaram como MENORES não corrigidos, todos avaliados e considerados mutantes
      equivalentes pelo próprio verificador: a guarda isVisible===wasVisible do
      watcher (o Vue não dispara para valores idênticos) e a ordem do spread em
      panelStyle (só importaria se style.value trouxesse maxHeight, o que não ocorre).
      TESTE: 72 casos (52 no componente + 20 no helper).
      Gates da tentativa 5: grep primevue VAZIO; git diff InputBase.vue VAZIO; não
      exportado; type-check limpo; lint limpo (2 warnings pré-existentes); suíte
      completa 694 passed / 18 failed — mesmas 18 do baseline, 0 regressão.
      ---
      TENTATIVA 5: APROVADO pelo quinto subagente verificador (opus). Ele auditou por
      sonda a única mudança de comportamento desta rodada (inheritAttrs) em 6 casos e
      confirmou que é estritamente aditiva e segura: class e style são MESCLADOS pelo
      Vue, o painel VENCE nas colisões de style (o top calculado derrota um top vindo
      de attrs) enquanto propriedades não-colidentes sobrevivem, props vencem attrs em
      role, onClick de attrs dispara uma única vez (sem duplicação), a máscara NÃO
      recebe os attrs (correto — id duplicado quebraria o aria-controls) e o focus
      trap segue intacto com onKeydown externo. Antes da mudança os attrs não chegavam
      a lugar nenhum, então nada deixou de ir para outro destino.
      Aplicou 20 mutações NOVAS: 12 mortas; das 8 sobreviventes julgou 5 equivalentes
      (previouslyFocused reatribuído a cada abertura; ordem de unbind/removeOverlay/
      unlockScroll — as três operações são independentes e têm guarda própria; ordem
      push/nextZIndex; nome da Transition, cosmético; role default, que todo consumidor
      passa explícito) e 3 como lacuna de cobertura sobre código de produção CORRETO.
      Confirmou também que os 5 testes daquela rodada são mecanismo, não teatro.
      Duas das três lacunas foram fechadas antes do commit (a terceira, o
      stopPropagation do onEscape, é inalcançável: o listener de captura no document
      trata o ESC antes — mutante equivalente, deixado como está):
      - clique num FILHO do gatilho não fecha (gatilhos reais são compostos: ícone +
        label dentro do botão; comparar por identidade em vez de contains faria o
        toggle fechar e reabrir no mesmo evento);
      - o style calculado do painel vence um style colidente vindo de attrs (trava a
        ordem do v-bind="attrs" antes de :class/:style no template).
      Ambas confirmadas por mutação. TOTAL FINAL: 74 testes (54 no componente + 20 no
      helper), ~50 mutações aplicadas ao longo das 5 rodadas.
      Gates finais: grep primevue VAZIO; git diff InputBase.vue VAZIO; não exportado
      em src/index.ts nem no manifesto; type-check limpo; lint limpo (2 warnings
      pré-existentes); suíte completa 696 passed / 18 failed — mesmas 18 do baseline
      nos mesmos 7 arquivos, 0 regressão.

  - id: 3
    componente: MaxBaseSpinner
    arquivo: src/components/base/MaxBaseSpinner.vue
    plano: prime_vue_migration/plans/03-MaxBaseSpinner.md
    primitivas: [ProgressSpinner]
    depende_de: []
    execucao: Concluído
    verificacao: Concluído
    tentativas: 0
    notas: >
      SVG animado puro. Usado por MaxPdfView e MaxInputFileUpload.
      DIVERGÊNCIA DO PLANO (§2): o plano afirma que nenhum consumidor passa props.
      O código diz o contrário e prevalece — MaxPdfView.vue:11 usa
      style="width:50px;height:50px" strokeWidth="7" animationDuration=".5s"
      aria-label="Custom ProgressSpinner", e MaxInputFileUpload.vue:27 usa
      style + animationDuration="2s". Consequências: animationDuration precisa de
      fato controlar a animação (não só existir como prop), e style/aria-label
      chegam como ATRIBUTOS, não props — o aria-label do MaxPdfView sobrescreve o
      default via herança de atributos, comportamento coberto por teste próprio.
      animationDuration é aplicado ao <svg> (rotação) E ao <circle> (traço), como
      no PrimeVue. Diferenças propositais mantidas do plano: stroke em cor única
      var(--max-primary-500) em vez dos 4 tons do Material que o PrimeVue ciclava;
      prefers-reduced-motion desacelera para 4s em vez de remover a animação (é
      indicador de progresso); role="progressbar" + aria-busy explícitos.
      ESCOPO: este item apenas CRIA a primitiva. A troca das tags nos dois
      consumidores (e a remoção do import de primevue/progressspinner) é dos ids
      22 e 32, conforme a fila — por isso o grep global de primevue ainda acusa
      MaxPdfView.vue e MaxInputFileUpload.vue.
      12 testes em tests/components/base/MaxBaseSpinner.test.ts. 7 mutações
      aplicadas e todas detectadas: viewBox alterado, strokeWidth fixo, duração não
      chegando ao circle, role removido, fill fixo, raio do círculo alterado,
      ariaLabel ignorado.
      Gates: grep primevue VAZIO no arquivo novo; não exportado em src/index.ts nem
      no manifesto; InputBase.vue intocado; type-check limpo; lint limpo (2
      warnings pré-existentes); suíte completa 708 passed / 18 failed — mesmas 18
      do baseline, 0 regressão.
      VERIFICAÇÃO (subagente opus): APROVADO na 1a tentativa. Conferiu as props reais
      do primevue/progressspinner em node_modules e confirmou paridade total (3 props,
