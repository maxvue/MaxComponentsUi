# =============================================================================
# STATUS DA MIGRAÇÃO — TRILHA "IN USE" (componentes USADOS nos projetos)
# =============================================================================
# Fonte de verdade da trilha executada por `execute_in_use.md`.
# Execução ITEM A ITEM, com PAUSA para teste manual do usuário entre cada item.
#
# Status possíveis (para `execucao` e `verificacao`):
#   Aguardando  -> ainda não iniciado
#   Realizando  -> em andamento, não finalizado
#   Concluído   -> finalizado e aprovado
#
# Campo extra desta trilha:
#   teste_usuario : Aguardando | Aprovado | Reprovado
#                   O executor PARA e espera o usuário validar manualmente.
#
# Campos por item:
#   id            : ordem de execução (NÃO reordenar) — mantém o id original
#   componente    : nome do arquivo .vue (sem extensão) ou do módulo
#   arquivo       : caminho do arquivo a ser alterado
#   plano         : caminho do plano de implementação detalhado
#   primitivas    : primitivas PrimeVue que este item elimina
#   depende_de    : ids que precisam estar Concluídos antes deste
#   uso           : censo de uso real nos projetos ~/GitHub (tags + imports)
#   execucao      : Aguardando | Realizando | Concluído
#   verificacao   : Aguardando | Realizando | Concluído
#   tentativas    : nº de vezes que a verificação reprovou
#   notas         : anotações livres do executor
# =============================================================================

meta:
  projeto: '@maxvue/max-components-ui'
  trilha: 'in_use'
  objetivo: 'Migrar, com validação manual entre itens, os componentes efetivamente usados nos projetos'
  primevue_versao_atual: '4.5.5'
  gerado_em: '2026-08-07'
  total_itens: 32
  modo_execucao: 'SEQUENCIAL COM PAUSA — um item por vez; parar e aguardar teste do usuário'

  # ---------------------------------------------------------------------------
  # PRÉ-REQUISITO: a trilha PRIMITIVE precisa estar concluída e integrada
  # ---------------------------------------------------------------------------
  # As primitivas base (ids 1-5) NÃO estão mais aqui — foram para
  # status_primitive.yaml / execute_primitive.md, que roda ANTES desta trilha.
  # Vários itens daqui têm `depende_de: [1]`, `[2]` etc.: esses ids referem-se aos
  # itens da trilha primitive. Confirme que estão Concluídos lá antes de começar.
  # ---------------------------------------------------------------------------
  depende_da_trilha: 'status_primitive.yaml (ids 1, 2, 3, 4, 5) — concluída e integrada'

  # Nota de ordem: o id 37 (install-plugin) aparece por ÚLTIMO, depois do 38, porque
  # depende dele (depende_de: [5, 35, 36, 38]). Essa inversão vem do status.yaml
  # original e é intencional — não "corrija" reordenando por id.

  # ---------------------------------------------------------------------------
  # REGRAS DESTA MIGRAÇÃO QUE DIFEREM DO BRIEFING ORIGINAL
  # ---------------------------------------------------------------------------
  # 1. REUSO PRIMEIRO: antes de implementar, o executor verifica se já existe no
  #    projeto uma solução concisa, PrimeVue-free e funcional para o mesmo fim.
  # 2. SEM CLASSES .p-*: as classes do PrimeVue não devem nem precisam ser
  #    emitidas. Use nomes próprios e remova as regras .p-* órfãs do repo.
  # 3. PARIDADE SÓ DE PROPS: apenas as PROPS precisam ser iguais às do PrimeVue.
  #    Markup interno, classes e estrutura são livres.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # ⚠️ EFEITO COLATERAL CONHECIDO DA REGRA 2 (reportar, não silenciar)
  # ---------------------------------------------------------------------------
  # Apps consumidoras estilizam classes .p-* por fora. Referências .p-* no
  # CSS/SCSS/Vue de cada projeto (censo de 2026-08-07):
  #   MinhaBibliaOnline : 254   <- tem uma pasta resources/Theme/PrimeVue/ inteira
  #   engeapp           : 167
  #   AgenteDeBolso     :  63
  #   SocialMedia       :   2
  #   MaxAdmin / mbo    :   0
  # Quando um seletor .p-* deixar de ser emitido, o CSS correspondente nessas
  # apps PARA DE APLICAR — a tela funciona, mas muda de aparência.
  # Isso é ACEITO nesta migração (decisão do usuário). A obrigação do executor é
  # LISTAR cada classe .p-* removida (campo `classes_p_removidas` do item), para
  # o ajuste posterior do CSS das apps.
  #
  # Componentes desta trilha com MAIS regras .p-* no <style> do próprio repo:
  #   MaxTagSelect (id 25), MaxPhoneField (id 24), MaxTableColumn (id 34),
  #   MaxInputCheckbox (id 19)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # CENSO DE USO (base da divisão in_use / no_use)
  # ---------------------------------------------------------------------------
  censo:
    data: '2026-08-07'
    projetos_analisados:
      - AgenteDeBolso
      - engeapp
      - MaxAdmin
      - mbo
      - MinhaBibliaOnline
      - SocialMedia
    escopo: 'resources/**/*.{vue,ts,js,tsx,jsx} — worktrees (-wt-) e node_modules excluídos'
    metodo: >-
      Contagem de USO REAL: tag de abertura (<Componente ...>), tag de fechamento
      (</Componente>) ou import ES. Simples menção da palavra NÃO conta — isso
      evitou 13 falsos positivos causados por classes CSS e comentários
      (ex.: a classe `icon-picker-drawer` fazia MaxInputIconPicker parecer usado).
    aliases: >-
      Todos os aliases de src/components-manifest.json (PascalCase, snake_case,
      kebab-case e formas sem o prefixo Max) + os re-exports de src/index.ts.
      Isso é essencial: a maioria dos projetos NÃO usa o prefixo `Max`.
      Ex.: MaxPhoneField aparece como <InputPhone>, MaxPdfView como <PdfView>.

  baseline_testes: 'PREENCHER no início da sessão (execute_in_use.md §0)'

  intocaveis:
    - src/components/InputBase.vue

